name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc (chequeo de tipos) && vite build. Cuando haya tests, sumar acá un paso `npm test`.
      - run: npm run build
